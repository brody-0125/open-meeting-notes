name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run build:inference
      - uses: actions/cache@v4
        id: stt-fixture-cache
        with:
          path: .ci-fixtures/stt-whisper-tiny
          key: omn-stt-whisper-tiny-${{ hashFiles('scripts/prepare-stt-test.mts', 'test/fixtures/speech.wav.sha256') }}
      - name: Prepare STT fixture
        if: steps.stt-fixture-cache.outputs.cache-hit != 'true'
        run: node scripts/prepare-stt-test.mjs .ci-fixtures/stt-whisper-tiny whisper-tiny
      - name: Whisper STT smoke
        env:
          OMN_STT_FIXTURE: ${{ github.workspace }}/.ci-fixtures/stt-whisper-tiny
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a npm run test:stt
      - run: npm test
      - run: npm run test:package-config

  macos-apple-stt:
    runs-on: macos-15
    env:
      OMN_APPLE_STT_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run build:inference
      - run: npm run ci:macos-apple-stt
