name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run build:inference
      - run: npm test
      - run: npm run test:package-config

  macos-apple-stt:
    runs-on: macos-15
    env:
      OMN_APPLE_STT_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run build:inference
      - run: npm run ci:macos-apple-stt
