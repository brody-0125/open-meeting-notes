name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (e.g. v1.0.0)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:inference
      - name: Package Windows x64
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $out = "releases/open-meeting-notes-$version-win32-x64"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          npm run package:windows -- $out
          $zip = "releases/open-meeting-notes-$version-win32-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $out -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $manifestHash = (Get-FileHash "$out/build-manifest.json" -Algorithm SHA256).Hash.ToLower()
          "open-meeting-notes-$version-win32-x64.zip sha256=$zipHash`nbuild-manifest inside package: $manifestHash" | Set-Content -Encoding utf8 "releases/open-meeting-notes-$version-win32-x64.SHA256.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            releases/open-meeting-notes-*-win32-x64.zip
            releases/open-meeting-notes-*-win32-x64.SHA256.txt

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:inference
      - run: npm run build:apple-stt-helper -- --release
      - name: Package macOS
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCH=$(uname -m)
          OUT="releases/open-meeting-notes-${VERSION}-darwin-${ARCH}"
          rm -rf "$OUT"
          mkdir -p releases
          npm run package:macos -- "$OUT"
          ZIP="releases/open-meeting-notes-${VERSION}-darwin-${ARCH}.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$OUT/open-meeting-notes.app" "$ZIP"
          ZIP_HASH=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          MANIFEST_HASH=$(shasum -a 256 "$OUT/build-manifest.json" | awk '{print $1}')
          printf '%s\n' "open-meeting-notes-${VERSION}-darwin-${ARCH}.zip sha256=${ZIP_HASH}" "build-manifest inside package: ${MANIFEST_HASH}" > "releases/open-meeting-notes-${VERSION}-darwin-${ARCH}.SHA256.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            releases/open-meeting-notes-*-darwin-*.zip
            releases/open-meeting-notes-*-darwin-*.SHA256.txt
